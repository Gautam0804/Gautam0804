<svg width="1200" height="360" viewBox="0 0 1200 360"
     xmlns="http://www.w3.org/2000/svg">

  <defs>

    <!-- Main neon gradient -->
    <linearGradient id="neonGradient"
                    x1="0%" y1="0%"
                    x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4db8"/>
      <stop offset="45%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <!-- Background -->
    <linearGradient id="bg"
                    x1="0%" y1="0%"
                    x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050507"/>
      <stop offset="45%" stop-color="#100a18"/>
      <stop offset="100%" stop-color="#050507"/>
    </linearGradient>

    <!-- Pink glow -->
    <radialGradient id="pinkGlow">
      <stop offset="0%" stop-color="#ff4db8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ff4db8" stop-opacity="0"/>
    </radialGradient>

    <!-- Purple glow -->
    <radialGradient id="purpleGlow">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>

    <!-- Grid -->
    <pattern id="grid"
             width="45"
             height="45"
             patternUnits="userSpaceOnUse">
      <path d="M45 0H0V45"
            fill="none"
            stroke="#ffffff"
            stroke-opacity="0.035"/>
    </pattern>

    <!-- Neon glow -->
    <filter id="neonGlow"
            x="-100%"
            y="-100%"
            width="300%"
            height="300%">
      <feGaussianBlur stdDeviation="5"
                      result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Strong glow -->
    <filter id="strongGlow"
            x="-100%"
            y="-100%"
            width="300%"
            height="300%">
      <feGaussianBlur stdDeviation="12"
                      result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

  </defs>


  <!-- ================================================= -->
  <!-- BACKGROUND -->
  <!-- ================================================= -->

  <rect width="1200"
        height="360"
        rx="22"
        fill="url(#bg)"/>


  <!-- Ambient glows -->

  <circle cx="80"
          cy="80"
          r="230"
          fill="url(#pinkGlow)"/>

  <circle cx="1120"
          cy="290"
          r="250"
          fill="url(#purpleGlow)"/>


  <!-- Grid -->

  <rect width="1200"
        height="360"
        fill="url(#grid)"/>


  <!-- ================================================= -->
  <!-- OUTER NEON BORDER -->
  <!-- ================================================= -->

  <rect x="16"
        y="16"
        width="1168"
        height="328"
        rx="20"
        fill="none"
        stroke="url(#neonGradient)"
        stroke-width="2"
        opacity="0.9"
        filter="url(#neonGlow)"/>


  <rect x="24"
        y="24"
        width="1152"
        height="312"
        rx="17"
        fill="none"
        stroke="#ffffff"
        stroke-opacity="0.05"/>


  <!-- ================================================= -->
  <!-- TERMINAL HEADER -->
  <!-- ================================================= -->

  <rect x="45"
        y="42"
        width="1110"
        height="38"
        rx="9"
        fill="#0c0c0f"
        stroke="#2b2630"/>


  <!-- macOS style buttons -->

  <circle cx="70"
          cy="61"
          r="6"
          fill="#ff5f57"/>

  <circle cx="92"
          cy="61"
          r="6"
          fill="#febc2e"/>

  <circle cx="114"
          cy="61"
          r="6"
          fill="#28c840"/>


  <!-- Terminal title -->

  <text x="600"
        y="66"
        text-anchor="middle"
        font-family="monospace"
        font-size="13"
        fill="#777">
  </text>


  <!-- ================================================= -->
  <!-- TERMINAL COMMAND -->
  <!-- ================================================= -->

  <text x="95"
        y="122"
        font-family="monospace"
        font-size="17"
        fill="#ff4db8">
    $
  </text>

  <text x="118"
        y="122"
        font-family="monospace"
        font-size="17"
        fill="#bdbdbd">
    whoami
  </text>


  <!-- ================================================= -->
  <!-- NAME -->
  <!-- ================================================= -->

  <text x="600"
        y="182"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="64"
        font-weight="800"
        letter-spacing="1"
        fill="white"
        filter="url(#neonGlow)">
    Gautam Yadav
  </text>


  <!-- Animated underline -->

  <rect x="430"
        y="198"
        width="340"
        height="3"
        rx="2"
        fill="url(#neonGradient)"
        filter="url(#neonGlow)">

    <animate
      attributeName="x"
      values="430;390;430"
      dur="4s"
      repeatCount="indefinite"/>

    <animate
      attributeName="width"
      values="340;420;340"
      dur="4s"
      repeatCount="indefinite"/>

  </rect>


  <!-- ================================================= -->
  <!-- PROFESSIONAL TITLE -->
  <!-- ================================================= -->

  <text x="600"
        y="240"
        text-anchor="middle"
        font-family="monospace"
        font-size="20"
        font-weight="700"
        fill="#ff4db8"
        filter="url(#neonGlow)">
    Software Engineer | Full Stack Developer | AI/ML Enthusiast
  </text>


  <!-- ================================================= -->
  <!-- TECH STACK -->
  <!-- ================================================= -->

  <text x="600"
        y="274"
        text-anchor="middle"
        font-family="monospace"
        font-size="15"
        fill="#c7c7c7">
    Java  •  Python  •  React  •  Node.js  •  MongoDB  •  AI/ML
  </text>


  <!-- ================================================= -->
  <!-- TERMINAL CURSOR -->
  <!-- ================================================= -->

  <text x="600"
        y="305"
        text-anchor="middle"
        font-family="monospace"
        font-size="18"
        fill="#ff4db8">

    <animate
      attributeName="opacity"
      values="1;0;1"
      dur="1s"
      repeatCount="indefinite"/>

    █

  </text>


  <!-- ================================================= -->
  <!-- DECORATIVE CIRCUIT LINES -->
  <!-- ================================================= -->

  <path d="M55 275 H150 V250 H205"
        fill="none"
        stroke="#ff4db8"
        stroke-opacity="0.45"
        stroke-width="1.5"/>

  <circle cx="205"
          cy="250"
          r="3"
          fill="#ff4db8"
          filter="url(#neonGlow)"/>


  <path d="M1145 95 H1060 V120 H1005"
        fill="none"
        stroke="#8b5cf6"
        stroke-opacity="0.45"
        stroke-width="1.5"/>

  <circle cx="1005"
          cy="120"
          r="3"
          fill="#8b5cf6"
          filter="url(#neonGlow)"/>


  <path d="M55 105 H115 V130"
        fill="none"
        stroke="#8b5cf6"
        stroke-opacity="0.35"
        stroke-width="1.5"/>


  <path d="M1145 270 H1080 V295 H1030"
        fill="none"
        stroke="#ff4db8"
        stroke-opacity="0.35"
        stroke-width="1.5"/>


  <!-- ================================================= -->
  <!-- FLOATING NEON PARTICLES -->
  <!-- ================================================= -->

  <circle cx="170"
          cy="175"
          r="2"
          fill="#ff4db8"
          filter="url(#neonGlow)">
    <animate attributeName="cy"
             values="175;155;175"
             dur="3s"
             repeatCount="indefinite"/>
  </circle>


  <circle cx="1030"
          cy="175"
          r="2"
          fill="#8b5cf6"
          filter="url(#neonGlow)">
    <animate attributeName="cy"
             values="175;195;175"
             dur="4s"
             repeatCount="indefinite"/>
  </circle>


  <circle cx="260"
          cy="300"
          r="2"
          fill="#8b5cf6"
          filter="url(#neonGlow)">
    <animate attributeName="cx"
             values="260;280;260"
             dur="3s"
             repeatCount="indefinite"/>
  </circle>


  <circle cx="940"
          cy="70"
          r="2"
          fill="#ff4db8"
          filter="url(#neonGlow)">
    <animate attributeName="cx"
             values="940;920;940"
             dur="3.5s"
             repeatCount="indefinite"/>
  </circle>


  <!-- ================================================= -->
  <!-- CORNER ACCENTS -->
  <!-- ================================================= -->

  <path d="M45 100 V125"
        stroke="#ff4db8"
        stroke-width="2"/>

  <path d="M1155 235 V260"
        stroke="#8b5cf6"
        stroke-width="2"/>


  <!-- Bottom neon line -->

  <line x1="430"
        y1="325"
        x2="770"
        y2="325"
        stroke="url(#neonGradient)"
        stroke-width="2"
        filter="url(#neonGlow)"/>

</svg>
