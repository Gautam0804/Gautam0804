<svg width="1200" height="360" viewBox="0 0 1200 360"
     xmlns="http://www.w3.org/2000/svg">

  <defs>

    <linearGradient id="background"
                    x1="0%" y1="0%"
                    x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090d"/>
      <stop offset="50%" stop-color="#0b0f16"/>
      <stop offset="100%" stop-color="#07090d"/>
    </linearGradient>

    <linearGradient id="accent"
                    x1="0%" y1="0%"
                    x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <radialGradient id="blueGlow">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid"
             width="40"
             height="40"
             patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40"
            fill="none"
            stroke="#ffffff"
            stroke-opacity="0.025"
            stroke-width="1"/>
    </pattern>

    <filter id="softGlow"
            x="-100%"
            y="-100%"
            width="300%"
            height="300%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

  </defs>

  <!-- BACKGROUND -->

  <rect x="0"
        y="0"
        width="1200"
        height="360"
        rx="18"
        fill="url(#background)"/>

  <circle cx="70"
          cy="70"
          r="260"
          fill="url(#blueGlow)"/>

  <circle cx="1130"
          cy="300"
          r="250"
          fill="url(#blueGlow)"/>

  <rect x="0"
        y="0"
        width="1200"
        height="360"
        fill="url(#grid)"/>

  <!-- OUTER BORDER -->

  <rect x="18"
        y="18"
        width="1164"
        height="324"
        rx="17"
        fill="none"
        stroke="#26303d"
        stroke-width="1"/>

  <rect x="19"
        y="19"
        width="1162"
        height="322"
        rx="16"
        fill="none"
        stroke="url(#accent)"
        stroke-width="1"
        opacity="0.35"/>

  <!-- TERMINAL HEADER -->

  <rect x="48"
        y="43"
        width="1104"
        height="38"
        rx="8"
        fill="#0d1117"
        stroke="#202733"
        stroke-width="1"/>

  <circle cx="71"
          cy="62"
          r="5"
          fill="#ff5f57"/>

  <circle cx="91"
          cy="62"
          r="5"
          fill="#febc2e"/>

  <circle cx="111"
          cy="62"
          r="5"
          fill="#28c840"/>

  <text x="600"
        y="66"
        text-anchor="middle"
        font-family="monospace"
        font-size="11"
        letter-spacing="1.5"
        fill="#667085">
    GAUTAM@ENGINEERING ~/profile
  </text>

  <!-- COMMAND -->

  <text x="92"
        y="119"
        font-family="monospace"
        font-size="15"
        font-weight="700"
        fill="#22d3ee">
    $
  </text>

  <text x="112"
        y="119"
        font-family="monospace"
        font-size="15"
        fill="#98a2b3">
    whoami
  </text>

  <!-- NAME -->

  <text x="600"
        y="177"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="58"
        font-weight="700"
        letter-spacing="0.5"
        fill="#f8fafc">
    Gautam Yadav
  </text>

  <!-- NAME ACCENT -->

  <rect x="470"
        y="193"
        width="260"
        height="2"
        rx="1"
        fill="url(#accent)"
        opacity="0.9">

    <animate
      attributeName="width"
      values="260;300;260"
      dur="5s"
      repeatCount="indefinite"/>

    <animate
      attributeName="x"
      values="470;450;470"
      dur="5s"
      repeatCount="indefinite"/>

  </rect>

  <!-- PROFESSIONAL TITLE -->

  <text x="600"
        y="232"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="18"
        font-weight="600"
        fill="#cbd5e1">
    Software Engineer
    <tspan fill="#475569"> • </tspan>
    Full Stack Developer
    <tspan fill="#475569"> • </tspan>
    AI/ML Enthusiast
  </text>

  <!-- TECH STACK -->

  <text x="600"
        y="263"
        text-anchor="middle"
        font-family="monospace"
        font-size="14"
        fill="#7f8ea3">
    Java
    <tspan fill="#334155"> • </tspan>
    Python
    <tspan fill="#334155"> • </tspan>
    React
    <tspan fill="#334155"> • </tspan>
    Node.js
    <tspan fill="#334155"> • </tspan>
    MongoDB
    <tspan fill="#334155"> • </tspan>
    AI/ML
  </text>

  <!-- STATUS -->

  <circle cx="565"
          cy="294"
          r="4"
          fill="#22c55e"
          filter="url(#softGlow)"/>

  <text x="577"
        y="298"
        font-family="monospace"
        font-size="12"
        fill="#64748b">
    building • solving • learning
  </text>

  <!-- LEFT CIRCUITS -->

  <path d="M48 268 H115 V248 H155"
        fill="none"
        stroke="#22d3ee"
        stroke-width="1"
        opacity="0.35"/>

  <circle cx="155"
          cy="248"
          r="2.5"
          fill="#22d3ee"
          opacity="0.8"/>

  <path d="M48 290 H92 V310 H135"
        fill="none"
        stroke="#6366f1"
        stroke-width="1"
        opacity="0.25"/>

  <!-- RIGHT CIRCUITS -->

  <path d="M1152 103 H1080 V123 H1045"
        fill="none"
        stroke="#6366f1"
        stroke-width="1"
        opacity="0.35"/>

  <circle cx="1045"
          cy="123"
          r="2.5"
          fill="#6366f1"
          opacity="0.8"/>

  <path d="M1152 276 H1090 V300 H1050"
        fill="none"
        stroke="#22d3ee"
        stroke-width="1"
        opacity="0.25"/>

  <!-- DATA POINTS -->

  <circle cx="190"
          cy="160"
          r="1.8"
          fill="#22d3ee"
          opacity="0.65">

    <animate
      attributeName="opacity"
      values="0.25;0.8;0.25"
      dur="3s"
      repeatCount="indefinite"/>

  </circle>

  <circle cx="1010"
          cy="175"
          r="1.8"
          fill="#6366f1"
          opacity="0.65">

    <animate
      attributeName="opacity"
      values="0.25;0.8;0.25"
      dur="4s"
      repeatCount="indefinite"/>

  </circle>

  <!-- CORNER MARKERS -->

  <path d="M48 100 V120"
        stroke="#22d3ee"
        stroke-width="2"
        opacity="0.65"/>

  <path d="M1152 240 V260"
        stroke="#6366f1"
        stroke-width="2"
        opacity="0.65"/>

  <!-- BOTTOM ACCENT -->

  <line x1="430"
        y1="325"
        x2="770"
        y2="325"
        stroke="url(#accent)"
        stroke-width="1.5"
        opacity="0.75"
        filter="url(#softGlow)"/>

  <line x1="530"
        y1="325"
        x2="670"
        y2="325"
        stroke="#ffffff"
        stroke-width="1"
        opacity="0.12"/>

  <!-- CURSOR -->

  <rect x="735"
        y="286"
        width="7"
        height="15"
        rx="1"
        fill="#22d3ee"
        opacity="0.9">

    <animate
      attributeName="opacity"
      values="1;0;1"
      dur="1s"
      repeatCount="indefinite"/>

  </rect>

</svg>
