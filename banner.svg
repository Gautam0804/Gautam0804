<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="Gautam Yadav GitHub profile banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070b12"/>
      <stop offset="52%" stop-color="#0b111b"/>
      <stop offset="100%" stop-color="#05080d"/>
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>

    <linearGradient id="nameGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="65%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#93c5fd"/>
    </linearGradient>

    <radialGradient id="orb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity=".18"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#94a3b8" stroke-opacity=".055"/>
    </pattern>

    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>

    <style>
      .mono {
        font-family: "JetBrains Mono","Fira Code","SFMono-Regular",Consolas,monospace;
      }

      .sans {
        font-family: Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      }

      .muted {
        fill:#64748b;
      }

      .line {
        stroke:#334155;
        stroke-opacity:.55;
        fill:none;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="360" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="18" fill="url(#grid)"/>

  <!-- Ambient light -->
  <circle
    cx="930"
    cy="95"
    r="230"
    fill="url(#orb)"
    filter="url(#softGlow)"
  />

  <circle
    cx="220"
    cy="300"
    r="180"
    fill="url(#orb)"
    opacity=".35"
    filter="url(#softGlow)"
  />

  <!-- Terminal frame -->
  <rect
    x="22"
    y="22"
    width="1156"
    height="316"
    rx="15"
    fill="none"
    stroke="#334155"
    stroke-opacity=".75"
  />

  <rect
    x="23"
    y="23"
    width="1154"
    height="44"
    rx="14"
    fill="#0f172a"
    fill-opacity=".78"
  />

  <path
    d="M23 67H1177"
    stroke="#334155"
    stroke-opacity=".7"
  />

  <!-- Window controls -->
  <circle cx="48" cy="45" r="5" fill="#475569"/>
  <circle cx="66" cy="45" r="5" fill="#475569"/>
  <circle cx="84" cy="45" r="5" fill="#475569"/>

  <!-- Terminal title -->
  <text
    x="104"
    y="50"
    class="mono"
    font-size="12"
    fill="#94a3b8"
    letter-spacing=".8"
  >
    GAUTAM YADAV ~/profile
  </text>

  <text
    x="1116"
    y="50"
    class="mono"
    font-size="11"
    fill="#475569"
    text-anchor="end"
  >
    main
  </text>

  <!-- Terminal command -->
  <text
    x="62"
    y="101"
    class="mono"
    font-size="14"
    fill="#22d3ee"
  >
    $
  </text>

  <text
    x="79"
    y="101"
    class="mono"
    font-size="14"
    fill="#cbd5e1"
  >
    whoami
  </text>

  <!-- Blinking cursor -->
  <rect
    x="145"
    y="89"
    width="7"
    height="15"
    rx="1"
    fill="#60a5fa"
  >
    <animate
      attributeName="opacity"
      values="1;0;1"
      dur="1.15s"
      repeatCount="indefinite"
    />
  </rect>

  <!-- Main identity -->
  <text
    x="600"
    y="159"
    class="sans"
    font-size="44"
    font-weight="700"
    fill="url(#nameGlow)"
    text-anchor="middle"
    letter-spacing="-1.2"
  >
    Gautam Yadav
  </text>

  <!-- Professional title -->
  <text
    x="600"
    y="191"
    class="mono"
    font-size="15"
    fill="#93c5fd"
    text-anchor="middle"
  >
    Software Engineer • Full Stack Developer • AI/ML Engineer
  </text>

  <!-- Animated underline -->
  <path
    d="M315 210H885"
    stroke="#1e293b"
    stroke-width="1"
  />

  <path
    d="M390 210H810"
    stroke="url(#accent)"
    stroke-width="2"
    stroke-linecap="round"
    filter="url(#glow)"
  >
    <animate
      attributeName="stroke-dasharray"
      values="0 420;420 0;0 420"
      dur="5s"
      repeatCount="indefinite"
    />
  </path>

  <!-- Tech stack -->
  <text
    x="600"
    y="241"
    class="mono"
    font-size="13"
    fill="#cbd5e1"
    text-anchor="middle"
  >
    Java • Python • React • Node.js • PostgreSQL • RAG • AI/ML
  </text>

  <!-- Status indicator -->
  <circle
    cx="505"
    cy="274"
    r="4"
    fill="#22d3ee"
    filter="url(#glow)"
  >
    <animate
      attributeName="opacity"
      values=".35;1;.35"
      dur="1.8s"
      repeatCount="indefinite"
    />
  </circle>

  <text
    x="518"
    y="279"
    class="mono"
    font-size="12"
    fill="#64748b"
  >
    building
  </text>

  <text
    x="590"
    y="279"
    class="mono"
    font-size="12"
    fill="#475569"
  >
    •
  </text>

  <text
    x="609"
    y="279"
    class="mono"
    font-size="12"
    fill="#64748b"
  >
    solving
  </text>

  <text
    x="678"
    y="279"
    class="mono"
    font-size="12"
    fill="#475569"
  >
    •
  </text>

  <text
    x="697"
    y="279"
    class="mono"
    font-size="12"
    fill="#64748b"
  >
    learning
  </text>

  <!-- LEFT CIRCUIT -->

  <g class="line">
    <path d="M62 139H184V122H235"/>
    <path d="M62 155H137V177H215"/>
    <path d="M62 303H154V286H203V300H250"/>
    <path d="M62 319H112V296H168"/>
    <path d="M109 122V108H137"/>
    <path d="M183 177V194H224"/>
  </g>

  <g fill="#22d3ee">
    <circle cx="62" cy="139" r="3" filter="url(#glow)"/>
    <circle cx="62" cy="155" r="3"/>
    <circle cx="62" cy="303" r="3" filter="url(#glow)"/>
    <circle cx="62" cy="319" r="3"/>
    <circle cx="235" cy="122" r="3"/>
    <circle cx="215" cy="177" r="3"/>
    <circle cx="250" cy="300" r="3"/>
  </g>

  <!-- RIGHT CIRCUIT -->

  <g class="line">
    <path d="M1138 132H1055V116H1005"/>
    <path d="M1138 150H1080V174H1015"/>
    <path d="M1138 300H1060V283H1002V299H952"/>
    <path d="M1138 319H1088V294H1030"/>
    <path d="M1091 116V102H1060"/>
    <path d="M1015 174V193H978"/>
  </g>

  <g fill="#60a5fa">
    <circle cx="1138" cy="132" r="3" filter="url(#glow)"/>
    <circle cx="1138" cy="150" r="3"/>
    <circle cx="1138" cy="300" r="3" filter="url(#glow)"/>
    <circle cx="1138" cy="319" r="3"/>
    <circle cx="1005" cy="116" r="3"/>
    <circle cx="1015" cy="174" r="3"/>
    <circle cx="952" cy="299" r="3"/>
  </g>

  <!-- Data labels -->
  <g
    class="mono"
    font-size="9"
    fill="#475569"
  >
    <text x="88" y="137">01</text>
    <text x="95" y="313">101</text>
    <text x="1087" y="130">AI</text>
    <text x="1075" y="314">API</text>
  </g>

  <!-- Bottom metadata -->
  <path
    d="M62 310H365"
    stroke="#1e293b"
  />

  <path
    d="M835 310H1138"
    stroke="#1e293b"
  />

  <text
    x="62"
    y="326"
    class="mono"
    font-size="9"
    fill="#334155"
  >
    01 / SOFTWARE
  </text>

  <text
    x="1138"
    y="326"
    class="mono"
    font-size="9"
    fill="#334155"
    text-anchor="end"
  >
    AI • SYSTEMS • ENGINEERING
  </text>

  <!-- Bottom accent -->
  <rect
    x="22"
    y="336"
    width="1156"
    height="2"
    rx="1"
    fill="url(#accent)"
    opacity=".8"
  />
</svg>
